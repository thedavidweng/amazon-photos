name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run check
      - run: git diff --exit-code
      - name: Build and smoke test aphotos
        run: |
          go build -o aphotos ./cmd/aphotos
          ./aphotos --version
          ./aphotos doctor --allow-unconfigured --json

  matrix:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: go test ./...
      - run: go build ./cmd/aphotos
