[tools]
go = "1.27.3"
gofumpt = "0.12.0"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.15.0"
goreleaser = "2.19.0"
jactionlint = "2.3.0"

[tasks.build]
run = "go build ./..."

[tasks.test]
run = "go test ./..."

[tasks.test-race]
run = "go test -race ./..."

[tasks.vet]
run = "go vet ./..."

[tasks.fmt]
run = "gofumpt -extra -w ."

[tasks.fmt-check]
run = '''
unformatted=$(gofumpt -extra -l .)
if [ -n "$unformatted" ]; then
  echo "gofumpt: files need formatting:"
  echo "$unformatted"
  exit 1
fi
'''

[tasks.mod-tidy-check]
run = '''
tmp_dir=$(mktemp -d)
trap 'rm -rf "$tmp_dir"' EXIT
cp go.mod "$tmp_dir/go.mod"
if [ -f go.sum ]; then cp go.sum "$tmp_dir/go.sum"; fi
go mod tidy -modfile="$tmp_dir/go.mod"
diff -u go.mod "$tmp_dir/go.mod"
if [ -f go.sum ] || [ -f "$tmp_dir/go.sum" ]; then
  diff -u go.sum "$tmp_dir/go.sum"
fi
'''

[tasks.lint]
run = '"$(mise where go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint@2.15.0)/bin/golangci-lint" run'

[tasks.conventions]
run = '''
for f in CLAUDE.md .cursorrules .windsurfrules .clinerules GEMINI.md; do
  if [ -e "$f" ]; then echo "forbidden per-tool agent file: $f (use AGENTS.md)"; exit 1; fi
done
dirs=""
for d in pkg cmd internal; do
  if [ -d "$d" ]; then dirs="$dirs $d"; fi
done
if [ -n "$dirs" ]; then
  files=$(find $dirs -name '*.go' ! -name '*_test.go')
  if [ -n "$files" ]; then
    total=$(cat $files | grep -cv '^[[:space:]]*$')
    comments=$(cat $files | grep -E '^[[:space:]]*//' | grep -cvE '^[[:space:]]*//(go:|nolint)' || true)
    if [ "$comments" -gt $((total * 5 / 100)) ]; then
      echo "comment budget exceeded: $comments comment lines > 5% of $total code lines"; exit 1
    fi
  fi
fi
'''

[tasks.check]
run = [
  "mise run fmt-check",
  "mise run mod-tidy-check",
  "mise run vet",
  "mise run build",
  "mise run test",
  "mise run test-race",
  "mise run lint",
  "mise run conventions",
]
